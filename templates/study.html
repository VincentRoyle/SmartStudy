{% extends "base.html" %}

{% block title %}Study - SmartStudy{% endblock %}

{% block content %}

<h1>Study Session</h1>

{% if flashcard %}
    <h2>{{ flashcard[1] }}</h2>

    <button onclick="document.getElementById('answer').style.display = 'block'">
        Show Answer
    </button>

    <p id="answer" style="display: none;">
        {{ flashcard[2] }}
    </p>

    <p>Topic: {{ flashcard[3] }}</p>

    <a href="{{ url_for('study', previous=flashcard[0]) }}">
        Next Card
    </a>
{% else %}
    <p>You don't have any flashcards yet.</p>
{% endif %}

{% endblock %}
